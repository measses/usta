name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export tool tests
        run: uv run --python 3.11 --with pytest pytest tests/ -q
      - name: Script tests
        run: bash tests/test_scripts.sh
      - name: ShellCheck
        run: shellcheck -x bin/setup.sh bin/usta-run bin/usta-push bin/_lib.sh tests/test_scripts.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
